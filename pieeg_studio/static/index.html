<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiEEG Studio</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/plotly.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/logo.png" alt="" class="logo">
      <div class="brand-text">
        <span class="brand-name">PiEEG <b>Studio</b></span>
        <span class="brand-sub">Offline EEG analysis · MNE-Python</span>
      </div>
    </div>
    <div class="ds-switch" id="dsSwitch"></div>
    <div class="top-actions">
      <span class="chip chip-offline" title="No internet, no device needed — everything runs on this computer"><i class="dot"></i>Offline</span>
      <span class="chip mono" id="mneChip">MNE …</span>
      <button class="btn" id="btnOpen"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 20h16"/></svg>Open recording</button>
      <div class="menu-wrap">
        <button class="btn btn-primary" id="btnExport" disabled><svg viewBox="0 0 24 24"><path d="M12 4v12m0 0 5-5m-5 5-5-5M4 20h16"/></svg>Export</button>
        <div class="menu" id="exportMenu"></div>
      </div>
      <button class="icon-btn" id="btnTheme" title="Toggle theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar">
      <div class="nav-group">Recording</div>
      <a data-view="overview" class="active"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Overview</a>
      <a data-view="signals"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Signal browser</a>
      <a data-view="channels"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/><circle cx="16" cy="13" r="1.4"/></svg>Channels &amp; quality</a>
      <div class="nav-group">Processing</div>
      <a data-view="pipeline"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></svg>Preprocessing</a>
      <a data-view="artifacts"><svg viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3zm0 6v5m0 3v.5"/></svg>Artefacts &amp; ICA</a>
      <div class="nav-group">Analysis</div>
      <a data-view="spectral"><svg viewBox="0 0 24 24"><path d="M4 20V10M9 20V4M14 20v-7M19 20V8"/></svg>Spectral &amp; bands</a>
      <a data-view="tf"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>Time–frequency</a>
      <a data-view="erp"><svg viewBox="0 0 24 24"><path d="M3 14c3 0 3-8 6-8s3 14 6 14 3-6 6-6"/></svg>Events &amp; ERP</a>
      <a data-view="connectivity"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8M7 8l4 8M17 8l-4 8"/></svg>Connectivity</a>
      <div class="nav-group">MNE</div>
      <a data-view="mne"><svg viewBox="0 0 24 24"><path d="M4 18 9 6l3 8 3-5 5 9"/></svg>MNE visual lab</a>
      <a data-view="moabb"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9m5 7V5m5 11v-6"/></svg>BCI &amp; MOABB</a>
      <a data-view="export"><svg viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>Export &amp; code</a>
      <div class="sidebar-foot" id="sideFoot"></div>
    </nav>

    <main id="main"></main>
  </div>

  <input type="file" id="fileInput" hidden accept=".csv,.txt,.tsv,.xlsx,.xls,.xlsm,.ods,.edf,.bdf,.gdf,.fif,.vhdr,.set">
  <input type="file" id="annInput" hidden accept=".json,.csv,.txt,.xlsx">
  <input type="file" id="presetInput" hidden accept=".json">
  <div class="toasts" id="toasts"></div>
  <div class="busy" id="busy"><div class="spinner"></div><span id="busyText">Processing…</span></div>
  <div class="modal-back" id="modal"></div>

  <script src="/static/app.js"></script>
</body>
</html>
